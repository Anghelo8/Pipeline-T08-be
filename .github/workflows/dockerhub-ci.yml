name: Docker Hub CI

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Aquí usamos los nombres exactos de tu imagen
          username: ${{ secrets.DOCKERHUB_USERNAME_ANGHELO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ANGHELO }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Revisa que tu archivo se llame Dockerfile (con D mayúscula)
          file: ./dockerfile-anghelo/Dockerfile 
          push: true
          # El tag usa tu usuario para crear el repo en Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME_ANGHELO }}/ase242s4-t08-be:latest