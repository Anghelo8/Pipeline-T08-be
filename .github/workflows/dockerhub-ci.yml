name: Docker Hub

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: 

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 # Actualizado a v3
        with:
          # USANDO MIS VARIABLES PERSONALIZADAS
          username: ${{ secrets.DOCKERHUB_USERNAME_ANGHELO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ANGHELO }}

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5 # Actualizado a v5
        with:
          context: .
          file: ./dockerfile-anghelo/Dockerfile 
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_ANGHELO }}/ase242s4-t08-be:latest
            ${{ secrets.DOCKERHUB_USERNAME_ANGHELO }}/ase242s4-t08-be:${{ github.sha }}
